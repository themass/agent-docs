# Generated by scripts/nginx/install-jc-nginx.sh — do not hand-edit on server;
# re-run the script or edit templates under scripts/nginx/templates/ in git.

worker_processes auto;
error_log __JC_NGINX_LOGS__/error.log warn;
pid __JC_NGINX_LOGS__/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       __JC_NGINX_CONF__/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log __JC_NGINX_LOGS__/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Every site lives in its own file under server/; adding or removing a site never
    # means editing this file.
    include __JC_NGINX_CONF__/server/*.conf;
}

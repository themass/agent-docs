# Shared by jc-site-http.conf and jc-site-https.conf. Kept in its own file so an
# `upstream` block is never defined twice when both server files are loaded —
# nginx treats a duplicate upstream name as a config error, not a merge.

upstream jc_web {
    server 127.0.0.1:__JC_WEB_PORT__;
    keepalive 32;
}

upstream jc_api {
    server 127.0.0.1:__JC_API_PORT__;
    keepalive 16;
}

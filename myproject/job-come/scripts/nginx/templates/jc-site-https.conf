# JobCome site — HTTPS (self-signed). Upstream definitions: jc-upstreams.conf
# (always loaded alongside this file via conf.d/*.conf). Written only when the
# configured HTTPS port is free on this host — install-jc-nginx.sh decides whether to render it.

server {
    listen __JC_HTTPS_PORT__ ssl default_server;
    http2 on;
    server_name __JC_SERVER_NAME__ localhost;

    ssl_certificate     __JC_SSL_DIR__/jc-selfsigned.crt;
    ssl_certificate_key __JC_SSL_DIR__/jc-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:JCSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    location /api/v1/ {
        proxy_pass http://jc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://jc_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://jc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

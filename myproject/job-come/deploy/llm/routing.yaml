# JobCome in-process LLM routing (litellm SDK, no proxy required)
# YuAI catalog (2026-09): mt-deepseek-v4-* 不存在；DeepSeek 用 bt-deepseek-v4-*。

scenarios:
  ingest_fast:
    - model: openai/bt-deepseek-v4-flash
      timeout_sec: 120
    - model: openai/bt-deepseek-v4-pro
      timeout_sec: 120
    - model: openai/mt-gpt-5-6-terra
      timeout_sec: 120
    - model: openai/mt-gpt-6-astra
      timeout_sec: 120

  writer:
    - model: openai/bt-deepseek-v4-pro
      timeout_sec: 180
    - model: openai/mt-gpt-5-6-terra
      timeout_sec: 180
    - model: openai/mt-gpt-6-astra
      timeout_sec: 180
    - model: openai/bt-deepseek-v4-flash
      timeout_sec: 180

  coach:
    - model: openai/mt-gpt-5-6-terra
      timeout_sec: 180
    - model: openai/mt-gpt-6-astra
      timeout_sec: 180
    - model: openai/bt-deepseek-v4-pro
      timeout_sec: 180
    - model: openai/bt-deepseek-v4-flash
      timeout_sec: 180

  vision:
    - model: openai/qwen-vl-ocr
      api_base_env: YUAI_VISION_API_BASE
      api_key_env: YUAI_VISION_API_KEY
      timeout_sec: 180

  flash:
    - model: openai/bt-deepseek-v4-flash
      timeout_sec: 60
    - model: openai/bt-deepseek-v4-pro
      timeout_sec: 60
    - model: openai/mt-gpt-5-6-terra
      timeout_sec: 60
    - model: openai/mt-gpt-6-astra
      timeout_sec: 60

defaults:
  api_base_env: YUAI_API_BASE
  api_key_env: YUAI_API_KEY
  temperature: 0.1

# JC LLM routing — copy to routing.yaml
#
# providers: named credential profiles → env var names in backend/server/.env
# scenarios: failover chains; each entry picks model + provider (or inline api_*_env)

providers:
  gateway:
    api_base_env: JC_LLM_API_BASE
    api_key_env: JC_LLM_API_KEY
  vision:
    api_base_env: JC_LLM_VISION_API_BASE
    api_key_env: JC_LLM_VISION_API_KEY
  # Per-vendor example (add matching vars to .env, then set provider on models):
  # anthropic:
  #   api_base_env: JC_LLM_ANTHROPIC_API_BASE
  #   api_key_env: JC_LLM_ANTHROPIC_API_KEY

scenarios:
  ingest_fast:
    # Structured extraction should not spend its budget on hidden reasoning.
    # Keep this policy scoped to ingestion; agent turns can still think.
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      # DeepSeek-compatible gateways may ignore reasoning_effort; this explicit
      # body flag disables their thinking mode without changing agent turns.
      extra_body:
        thinking:
          type: disabled
    - model: openai/claude-haiku-5-5
      provider: gateway
      # provider: anthropic   # when Claude uses a different host/key
      timeout_sec: 120
      reasoning_effort: none
      # DeepSeek-compatible gateways may ignore reasoning_effort; this explicit
      # body flag disables their thinking mode without changing agent turns.
      extra_body:
        thinking:
          type: disabled

  writer:
    - model: openai/gpt-6-1-sol
      provider: gateway
      timeout_sec: 180

  coach:
    - model: openai/gpt-6-1-sol
      provider: gateway
      timeout_sec: 180

  vision:
    - model: openai/qwen-vl-ocr
      provider: vision
      timeout_sec: 180

  flash:
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 60

defaults:
  provider: gateway
  api_base_env: JC_LLM_API_BASE
  api_key_env: JC_LLM_API_KEY
  temperature: 0.1
  # Requested output ceiling, not context capacity or per-run usage budget.
  # Override on a deployment only when its actual gateway limit is verified.
  max_tokens: 100000

# Gateway prices, USD per 1M tokens. Only needed for models litellm's bundled price
# map does not know -- which is all of the vendor-neutral names below, so without
# this block the admin LLM list's 花费 column stays empty. Public model names that
# litellm already prices can be left out. A model with no entry here and none in
# litellm reports an empty cost rather than 0.
#
# These are placeholders: replace with your gateway's actual rate card.
pricing:
  openai/gpt-6-1-sol:
    prompt_usd_per_1m: 2.5
    completion_usd_per_1m: 10.0
  openai/claude-haiku-5-5:
    prompt_usd_per_1m: 1.0
    completion_usd_per_1m: 5.0
  openai/deepseek-v4-flash:
    prompt_usd_per_1m: 0.3
    completion_usd_per_1m: 1.2
  openai/qwen-vl-ocr:
    prompt_usd_per_1m: 0.5
    completion_usd_per_1m: 1.5

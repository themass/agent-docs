# JC LLM routing — copy to routing.yaml
#
# This file holds per-position TUNING only. Model names live in `.env`:
#
#   JC_LLM_MODEL_<SCENARIO>=openai/first-choice,openai/backup
#
# Comma-separated, in failover order. The n-th model in that list takes the n-th
# entry under the matching scenario here. Why split: these numbers were measured
# against the gateway and rarely change, while the model changes often. Naming a
# model in both places is what makes "which one is in effect" unclear.
#
# `providers:` maps a provider name used by an entry to the env vars holding its
# base URL and key. Secrets never appear in this file.
#
# Supported per-entry keys:
#   provider           a name from `providers:` (else `defaults.provider`)
#   api_base_env       inline override of the base-URL env var
#   api_key_env        inline override of the key env var
#   timeout_sec        budget for one attempt on this position
#   temperature        overrides defaults.temperature
#   reasoning_effort   none | low | medium | high — `none` is meaningful
#   max_tokens         output ceiling for this position
#   extra_body         raw body fields, for flags the gateway expects that
#                      litellm does not model (e.g. thinking: {type: disabled})

providers:
  gateway:
    api_base_env: JC_LLM_API_BASE
    api_key_env: JC_LLM_API_KEY
  vision:
    api_base_env: JC_LLM_VISION_API_BASE
    api_key_env: JC_LLM_VISION_API_KEY
  # Per-vendor example (add matching vars to .env, then set provider on entries):
  # anthropic:
  #   api_base_env: JC_LLM_ANTHROPIC_API_BASE
  #   api_key_env: JC_LLM_ANTHROPIC_API_KEY

scenarios:
  ingest_fast:
    # Structured extraction should not spend its budget on hidden reasoning.
    # Keep this policy scoped to ingestion; agent turns can still think.
    - provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      # DeepSeek-compatible gateways may ignore reasoning_effort; this explicit
      # body flag disables their thinking mode without changing agent turns.
      extra_body:
        thinking:
          type: disabled
    - provider: gateway
      timeout_sec: 120
      reasoning_effort: none

  writer:
    - provider: gateway
      timeout_sec: 180
    - provider: gateway
      timeout_sec: 180

  coach:
    - provider: gateway
      timeout_sec: 180
    - provider: gateway
      timeout_sec: 180

  reviewer:
    - provider: gateway
      timeout_sec: 180
    - provider: gateway
      timeout_sec: 180

  vision:
    - provider: vision
      timeout_sec: 180
      # Measured: this endpoint rejects anything above 32768 with
      # `InvalidParameter`, before reading the image.
      max_tokens: 32768
    - provider: vision
      timeout_sec: 180

  flash:
    - provider: gateway
      timeout_sec: 60
    - provider: gateway
      timeout_sec: 60

defaults:
  provider: gateway
  api_base_env: JC_LLM_API_BASE
  api_key_env: JC_LLM_API_KEY
  temperature: 0.1
  max_tokens: 100000

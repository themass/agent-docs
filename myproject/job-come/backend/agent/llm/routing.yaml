# JC LLM routing — per-model provider (base/key) via named profiles in .env
# Each provider maps to api_base_env + api_key_env (never put secrets in this file).
#
# Gateway: https://gpt.sspacee.com/v1 (set in .env, not here). It serves three
# models, so every chain below is drawn from the same three — there is no fourth
# name to fail over to:
#   deepseek-v4-flash  cheap/fast, leads the extraction and lightweight chains
#   deepseek-v4-pro    stronger, leads the chains whose output a user reads
#   qwen-vl-max        vision/OCR
#
# Chains are two deep rather than three. With one gateway and three models, a
# third hop could only repeat a model already tried, which costs a second
# timeout without adding a chance of success.

providers:
  gateway:
    api_base_env: JC_LLM_API_BASE
    api_key_env: JC_LLM_API_KEY
  vision:
    api_base_env: JC_LLM_VISION_API_BASE
    api_key_env: JC_LLM_VISION_API_KEY
  # Example second gateway (uncomment + set env vars when models use another host):
  # alt:
  #   api_base_env: JC_LLM_ALT_API_BASE
  #   api_key_env: JC_LLM_ALT_API_KEY

scenarios:
  ingest_fast:
    # Ingestion is a structured extraction task, not an agent turn. Explicitly
    # disable hidden reasoning here; the previous default spent 60 seconds
    # emitting reasoning with zero JSON content and timed out. This policy is
    # scoped to ingest_fast, so conversational agent thinking remains enabled.
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      # DeepSeek-compatible gateways may ignore reasoning_effort; this explicit
      # body flag disables their thinking mode without changing agent turns.
      extra_body:
        thinking:
          type: disabled
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      extra_body:
        thinking:
          type: disabled

  writer:
    # `pro` leads: this chain produces the document the user reads and exports,
    # and it is also the chain the repair pass reuses. `flash` is the fallback
    # rather than the lead because a weak first draft is what the whole
    # evaluate-repair loop exists to avoid paying for twice.
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 180
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 180

  coach:
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 180
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 180

  vision:
    - model: openai/qwen-vl-max
      provider: vision
      timeout_sec: 180
      # Must be set explicitly, and must not be lowered casually.
      #
      # The `defaults.max_tokens` of 100000 is above every Qwen-VL ceiling, and
      # the gateway rejects it with a 400 before reading any image — not a
      # timeout, so it fails instantly and identically every time, and with a
      # single vision endpoint there is nothing to fail over to. That is exactly
      # how every screenshot silently became "unreadable" once before.
      #
      # 8192 is a floor as much as a cap: `profile_vision` sends all pages in one
      # call and expects a full structured resume JSON back, which for a
      # multi-page resume runs several thousand tokens. A smaller ceiling
      # truncates mid-JSON and fails parsing instead of failing the request.
      # So if this gateway rejects 8192 for qwen-vl-max, the answer is a
      # different vision model, not a smaller number.
      max_tokens: 8192

  flash:
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 60
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 60

defaults:
  provider: gateway
  api_base_env: JC_LLM_API_BASE
  api_key_env: JC_LLM_API_KEY
  temperature: 0.1
  # Requested output ceiling, not context capacity or per-run usage budget.
  # Override on a deployment only when its actual gateway limit is verified.
  max_tokens: 100000

# Gateway prices, USD per 1M tokens. Only needed for models litellm's bundled price
# map does not know -- which is all of the vendor-neutral names below, so without
# this block the admin LLM list's 花费 column stays empty. Public model names that
# litellm already prices can be left out. A model with no entry here and none in
# litellm reports an empty cost rather than 0.
#
# Left commented out on purpose: a placeholder rate card would make the 花费 column
# show confident numbers that are wrong, which is worse than showing nothing.
# Uncomment and fill in your gateway's real rates to turn the column on.
# pricing:
#   openai/deepseek-v4-pro:
#     prompt_usd_per_1m: 2.5
#     completion_usd_per_1m: 10.0
#   openai/deepseek-v4-flash:
#     prompt_usd_per_1m: 0.3
#     completion_usd_per_1m: 1.2
#   openai/qwen-vl-max:
#     prompt_usd_per_1m: 0.5
#     completion_usd_per_1m: 1.5

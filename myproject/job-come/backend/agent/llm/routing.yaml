# JC LLM routing — per-model provider (base/key) via named profiles in .env
# Each provider maps to api_base_env + api_key_env (never put secrets in this file).
#
# Gateway: http://gpt.sspacee.com/v1 (set in .env, not here). Every model it
# lists was probed on 2026-10-23 with both a text and an image request, and
# timed on a long-JSON workload like the one these chains actually run:
#   deepseek-v4-flash           152 tok/s, reads images — leads extraction
#   gpt-5.6-luna                125 tok/s, reads images — the vision second hop
#   deepseek-v4-pro             117 tok/s, refuses images — leads writer/coach
#   qwen3-vl-plus               reads images, max_tokens ceiling 32768 — leads vision
#   doubao-seed-2-0-pro-260215   46 tok/s — in no chain, and keep it that way:
#                               it is 3.3x slower than flash for the same output
#                               and would blow any per-attempt budget on its own
#
# This is a NewAPI relay, so each hop adds its own latency on top of the upstream
# model. Budgets live in config.py, which carries the measurements behind them.
#
# Plain http, not https: the host answers 443 with a self-signed certificate,
# which litellm (correctly) refuses, and that refusal is a connection error at
# TLS handshake — every chain fails identically before a request is sent. http
# is the stopgap; the fix is a real certificate on the gateway.
#
# The text chains are two deep. With one gateway, a third hop could only repeat
# a model already tried, which costs a second timeout without adding a chance
# of success.
#
# Note on names: the gateway echoes `deepseek-v4-flash` back as `deepseek-flash`
# in the response, and that echoed name is what gets logged as `final_model`.
# Anything keyed on the served name — the `pricing` block below — needs the
# echoed spelling, not the requested one.

providers:
  gateway:
    api_base_env: JC_LLM_API_BASE
    api_key_env: JC_LLM_API_KEY
  vision:
    api_base_env: JC_LLM_VISION_API_BASE
    api_key_env: JC_LLM_VISION_API_KEY
  # Example second gateway (uncomment + set env vars when models use another host):
  # alt:
  #   api_base_env: JC_LLM_ALT_API_BASE
  #   api_key_env: JC_LLM_ALT_API_KEY

scenarios:
  ingest_fast:
    # Ingestion is a structured extraction task, not an agent turn. Explicitly
    # disable hidden reasoning here; the previous default spent 60 seconds
    # emitting reasoning with zero JSON content and timed out. This policy is
    # scoped to ingest_fast, so conversational agent thinking remains enabled.
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      # DeepSeek-compatible gateways may ignore reasoning_effort; this explicit
      # body flag disables their thinking mode without changing agent turns.
      extra_body:
        thinking:
          type: disabled
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      extra_body:
        thinking:
          type: disabled

  writer:
    # `pro` leads: this chain produces the document the user reads and exports,
    # and it is also the chain the repair pass reuses. `flash` is the fallback
    # rather than the lead because a weak first draft is what the whole
    # evaluate-repair loop exists to avoid paying for twice.
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 180
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 180

  coach:
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 180
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 180

  # Interview reviewer (AGENTS-DESIGN §4.2): an independent judge of a finished mock session.
  # It is its own scenario so the model can differ from the interviewer's. Until a different
  # model is chosen here, it uses the same chain as `coach`.
  reviewer:
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 180
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 180

  vision:
    - model: openai/qwen3-vl-plus
      provider: vision
      timeout_sec: 180
      # Must be set explicitly, and must not be lowered casually.
      #
      # Measured 2026-10-23, not guessed: this endpoint accepts 32768 and rejects
      # 65536 with `InvalidParameter: Range of max_tokens should be [1, 32768]`.
      # The `defaults.max_tokens` of 100000 therefore draws that same rejection —
      # before any image is read, and instantly rather than as a timeout. That is
      # exactly how every screenshot silently became "unreadable" once before.
      #
      # 32768 rather than something smaller: `profile_vision` sends every page in
      # one call and expects a whole structured resume JSON back, so a low
      # ceiling truncates mid-JSON and fails parsing instead of failing the
      # request — the quieter of the two failures. Sitting at the measured
      # maximum is safe because the hop below catches a 400 if it ever drops.
      max_tokens: 32768
    # Second vision endpoint, which this chain has never had before. The earlier
    # outage was total precisely because `Fallbacks=None`: one rejected request
    # and the model was told the attachment was unreadable. Probed 2026-10-23 to
    # read a test image back verbatim and to accept max_tokens=100000 without
    # complaint, so it needs no ceiling override — and it is the only reason
    # vision works at all right now.
    #
    # Kept second, not first: a Qwen-VL model is the intended OCR engine and a
    # general model is the understudy. Fixing the channel above reverts this hop
    # to unused without another edit.
    #
    # `deepseek-v4-flash` also read the test image, so it is a third candidate if
    # this one ever fails. Not added: `deepseek-v4-pro` refuses images outright
    # ("无法查看图片"), so the two text chains cannot double as a vision path.
    - model: openai/gpt-5.6-luna
      provider: vision
      timeout_sec: 180

  flash:
    - model: openai/deepseek-v4-flash
      provider: gateway
      timeout_sec: 60
    - model: openai/deepseek-v4-pro
      provider: gateway
      timeout_sec: 60

defaults:
  provider: gateway
  api_base_env: JC_LLM_API_BASE
  api_key_env: JC_LLM_API_KEY
  temperature: 0.1
  # Requested output ceiling, not context capacity or per-run usage budget.
  # Override on a deployment only when its actual gateway limit is verified.
  max_tokens: 100000

# Gateway prices, USD per 1M tokens. Only needed for models litellm's bundled price
# map does not know -- which is all of the vendor-neutral names below, so without
# this block the admin LLM list's 花费 column stays empty. Public model names that
# litellm already prices can be left out. A model with no entry here and none in
# litellm reports an empty cost rather than 0.
#
# Left commented out on purpose: a placeholder rate card would make the 花费 column
# show confident numbers that are wrong, which is worse than showing nothing.
# Uncomment and fill in your gateway's real rates to turn the column on.
# pricing:
#   openai/deepseek-v4-pro:
#     prompt_usd_per_1m: 2.5
#     completion_usd_per_1m: 10.0
#   openai/deepseek-v4-flash:
#     prompt_usd_per_1m: 0.3
#     completion_usd_per_1m: 1.2
#   openai/qwen-vl-max:
#     prompt_usd_per_1m: 0.5
#     completion_usd_per_1m: 1.5

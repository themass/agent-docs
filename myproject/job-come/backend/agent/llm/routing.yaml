# JC LLM routing — per-position tuning only. MODEL NAMES ARE NOT HERE.
#
# Where a model is named:
#   .env  JC_LLM_MODEL_<SCENARIO>=openai/first,openai/second
#         Comma-separated, in failover order. This file, per scenario, says only
#         how each *position* is called; the n-th model in that list takes the
#         n-th entry below. A chain longer than the list here repeats the last
#         entry's tuning.
#
# Why the split: the values below were measured against the gateway and should
# not be retyped every time a model is swapped, while the model itself changes
# far more often. Naming models in both places is what makes "which one is in
# effect" unclear, so there is exactly one source for names and one for tuning.
#
# Before pointing `.env` at a new gateway, list what it actually serves:
#   curl "$JC_LLM_API_BASE/models" -H "Authorization: Bearer $JC_LLM_API_KEY"
# A model the gateway does not have fails every call with 503 "无可用渠道", and
# when the whole chain is unavailable the fallback cannot save it either.
#
# `providers:` maps a name used by an entry to the env vars holding its base URL
# and key. Secrets never appear in this file.

providers:
  gateway:
    api_base_env: JC_LLM_API_BASE
    api_key_env: JC_LLM_API_KEY
  vision:
    api_base_env: JC_LLM_VISION_API_BASE
    api_key_env: JC_LLM_VISION_API_KEY

scenarios:
  # Structured extraction, not an agent turn: hidden reasoning is disabled here
  # and only here, so conversational turns can still think. An earlier default
  # spent 60s emitting reasoning and returned no JSON at all.
  ingest_fast:
    - provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      # Some gateways ignore `reasoning_effort`; this body flag disables their
      # thinking mode without touching agent turns.
      extra_body:
        thinking:
          type: disabled
    - provider: gateway
      timeout_sec: 120
      reasoning_effort: none
      extra_body:
        thinking:
          type: disabled

  # Produces the document the user reads and exports; the repair pass reuses it.
  # A weak first draft is what the evaluate-repair loop exists to avoid paying
  # for twice, so the strong model leads and the fast one is the understudy.
  writer:
    - provider: gateway
      timeout_sec: 180
    - provider: gateway
      timeout_sec: 180

  coach:
    - provider: gateway
      timeout_sec: 180
    - provider: gateway
      timeout_sec: 180

  # Independent judge of a finished mock session (AGENTS-DESIGN §4.2). Its own
  # scenario so the reviewer's model can differ from the interviewer's.
  reviewer:
    - provider: gateway
      timeout_sec: 180
    - provider: gateway
      timeout_sec: 180

  vision:
    - provider: vision
      timeout_sec: 180
      # Must be set explicitly, and must not be lowered casually.
      #
      # Measured, not guessed: this endpoint accepts 32768 and rejects 65536 with
      # `InvalidParameter: Range of max_tokens should be [1, 32768]`. The
      # `defaults.max_tokens` of 100000 therefore draws that same rejection —
      # before any image is read, and instantly rather than as a timeout. That is
      # how every screenshot once silently became "unreadable".
      #
      # 32768 rather than something smaller: profile_vision sends every page in
      # one call and expects a whole structured resume JSON back, so a low
      # ceiling truncates mid-JSON and fails parsing instead of failing the
      # request — the quieter of the two failures.
      max_tokens: 32768
    # The understudy. Keep the second hop vision-capable: a text-tuned model reads
    # an image poorly even when it accepts one, so a text chain cannot double as
    # an OCR path.
    - provider: vision
      timeout_sec: 180

  # Light single calls: fit scoring, localisation, follow-up judgement, resume
  # review. Short budget because none of them produce a long document.
  flash:
    - provider: gateway
      timeout_sec: 60
    - provider: gateway
      timeout_sec: 60

defaults:
  provider: gateway
  api_base_env: JC_LLM_API_BASE
  api_key_env: JC_LLM_API_KEY
  temperature: 0.1
  # Requested output ceiling, not context capacity or a per-run usage budget.
  # Override on a deployment only when its actual gateway limit is verified.
  max_tokens: 100000

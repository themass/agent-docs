# LiteLLM — optional local proxy; reads JC_LLM_* from .env

model_list:
  - model_name: jc-fast
    litellm_params:
      model: openai/bt-deepseek-v4-flash
      api_base: os.environ/JC_LLM_API_BASE
      api_key: os.environ/JC_LLM_API_KEY

  - model_name: jc-writer
    litellm_params:
      model: openai/bt-deepseek-v4-pro
      api_base: os.environ/JC_LLM_API_BASE
      api_key: os.environ/JC_LLM_API_KEY

  - model_name: jc-coach
    litellm_params:
      model: openai/mt-gpt-5-6-terra
      api_base: os.environ/JC_LLM_API_BASE
      api_key: os.environ/JC_LLM_API_KEY

  # Vision — separate key/url/model (OCR / scanned resume)
  - model_name: jc-vision
    litellm_params:
      model: openai/qwen-vl-ocr
      api_base: os.environ/JC_LLM_VISION_API_BASE
      api_key: os.environ/JC_LLM_VISION_API_KEY

router_settings:
  routing_strategy: simple-shuffle

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  success_callback: ["langfuse_otel"]
  failure_callback: ["langfuse_otel"]

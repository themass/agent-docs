# Industry / role follow-up question bank (coach-mock)
backend:
  - "这个接口在高并发下如何限流和降级？"
  - "数据一致性是怎么保证的？CAP 你怎么取舍？"
  - "如果 P99 突然翻倍，你的排查顺序是什么？"
frontend:
  - "首屏性能你关注哪些指标？怎么优化？"
  - "复杂表单状态你怎么管理？"
  - "如何做组件库版本兼容与灰度？"
pm:
  - "你如何验证这个需求值得做？"
  - "需求被研发挑战时你怎么推进？"
  - "上线后指标没涨，你会怎么复盘？"
data:
  - "实验显著但业务不显著，你怎么解释？"
  - "特征缺失或样本偏差怎么处理？"
  - "如何把分析结论变成可执行的产品动作？"
devops:
  - "发布失败回滚 SOP 是什么？"
  - "容量规划你怎么做？"
  - "告警太多怎么降噪？"
ios:
  - "内存泄漏或卡顿你怎么定位？"
  - "离线场景与弱网你怎么设计？"
general:
  - "你和上级意见不一致时怎么处理？"
  - "说一个你失败的经历，你学到了什么？"
  - "为什么离开上一家公司？"

design:
  - "你如何把用户研究转化为设计取舍，并验证可用性？"
  - "你如何协调业务目标、体验质量和研发成本？"
operations:
  - "你如何定义运营目标并拆解到可执行动作？"
  - "活动效果如何归因？没有预算时你怎么验证方案？"
marketing:
  - "你如何选择目标人群、渠道和衡量指标？"
  - "增长效果如何区分自然增长与活动贡献？"
sales:
  - "你如何发现客户需求并推进复杂决策链？"
  - "你如何管理商机优先级和销售预测？"
customer_success:
  - "你如何识别流失风险并推动客户获得价值？"
  - "客户诉求与产品能力冲突时你怎么处理？"
hr:
  - "你如何定义岗位需求并评估招聘质量？"
  - "组织目标与员工诉求冲突时你如何协调？"
finance:
  - "你如何把经营数据转化为预算和资源决策？"
  - "你如何识别财务风险并保持业务沟通有效？"
legal:
  - "你如何评估业务方案的合规风险并提出替代路径？"
  - "合同风险与业务时效冲突时你如何排序？"
management:
  - "你如何明确团队目标并处理跨部门依赖？"
  - "你的个人贡献和团队成果分别是什么？"

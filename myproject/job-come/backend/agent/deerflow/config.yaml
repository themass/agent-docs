# JC embedded DeerFlow harness (see docs/architecture/TECH-AGENT.md)
config_version: 3

# Models are NOT named here. `model:` is a *scenario* in
# backend/agent/llm/routing.yaml, and the adapter resolves the endpoint chain
# (plus failover order and credentials) from that file at call time.
#
# This indirection exists because naming models here created a second source of
# truth that had already drifted: `jc-writer` said deepseek-v4-flash while the
# `writer` chain led with gpt-6-1-sol. To change a model, edit routing.yaml.
# Output limits are owned by routing.yaml defaults/per-endpoint overrides.
# Do not override them here: a harness-wide cap would mask fallback policies.
models:
  - name: jc-coach
    display_name: JC Coach
    use: jc.llm.chat_litellm:ChatLiteLLMRouter
    model: coach
    context_window: 200000
    # Declares the reasoning contract so DeerFlow's factory treats this model as
    # thinking-capable (has_thinking_settings=True) and forwards reasoning_effort
    # to ChatLiteLLMRouter's constructor on every call where thinking_enabled is
    # true (the client default for the main agent loop). Probed against the
    # gateway directly on the previous model set: the lead model returned
    # reasoning_content for reasoning_effort=low and the failover hop returned it
    # too (ignoring the effort hint), while one hop surfaced none at all, so
    # failover calls simply ran without visible thinking (drop_params keeps the
    # request from erroring). Not re-probed against deepseek-v4-pro/flash — if
    # thinking stops appearing in the coach UI, this pair is the thing to check.
    supports_thinking: true
    supports_reasoning_effort: true
    when_thinking_enabled:
      reasoning_effort: low

  # The independent reviewer (AGENTS-DESIGN §4.2, §5). Its own model so the report is not produced
  # by the interviewer's model; `reviewer` is a scenario in routing.yaml.
  - name: jc-reviewer
    display_name: JC Reviewer
    use: jc.llm.chat_litellm:ChatLiteLLMRouter
    model: reviewer
    context_window: 200000

  # The export reviewer subtask runs on the flash scenario, as the review did before it became a subtask.
  - name: jc-flash
    display_name: JC Flash
    use: jc.llm.chat_litellm:ChatLiteLLMRouter
    model: flash
    context_window: 200000

  - name: jc-writer
    display_name: JC Writer
    use: jc.llm.chat_litellm:ChatLiteLLMRouter
    model: writer
    context_window: 200000
    # Same reasoning contract as jc-coach above — see that comment for the
    # gateway probe results. Writer benefits from visible reasoning too since
    # resume rewrites go through the same elevate/export agent loop.
    supports_thinking: true
    supports_reasoning_effort: true
    when_thinking_enabled:
      reasoning_effort: low

skills:
  path: skills

# Both values come from JC settings via `$VAR` (see AppConfig.resolve_env_variables):
# the DSN holds a password and must not be committed, and the backend has to be
# switchable so a developer box without Postgres can still run on sqlite.
# `postgresql+psycopg://` is a SQLAlchemy URL; DeerFlow strips the `+driver`
# before handing it to libpq.
checkpointer:
  type: $JC_DEERFLOW_CHECKPOINT_BACKEND
  connection_string: $JC_DEERFLOW_CHECKPOINT_DSN

token_usage:
  enabled: true

summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      # Auto: JC_MODEL_CONTEXT_WINDOW × JC_SUMMARIZATION_TRIGGER_RATIO (default 200k × 0.16 = 32k)
      value: $JC_SUMMARIZATION_TRIGGER_TOKENS
  keep:
    type: messages
    value: $JC_SUMMARIZATION_KEEP_MESSAGES
  # Must be >= the trigger's token value: this is the budget the messages-to-
  # summarize chunk gets trimmed to *before* being handed to the summarizer.
  # A value smaller than the trigger silently drops the oldest history beyond
  # this cap instead of summarizing it — no summary, no record, just gone.
  # 40000 covers the trigger's current auto value (32000) with headroom for
  # when JC_MODEL_CONTEXT_WINDOW grows.
  trim_tokens_to_summarize: 40000

# Default-off in DeerFlow; both decided on here (see docs/architecture
# ADR on the audit that added them). `enabled`/`token_secret`/`max_tokens`
# come from JC settings via `$VAR`, same mechanism as summarization above —
# one place to flip these, not two.
pii_redaction:
  enabled: $JC_PII_REDACTION_ENABLED
  token_secret: $JC_PII_REDACTION_TOKEN_SECRET

token_budget:
  enabled: $JC_TOKEN_BUDGET_ENABLED
  max_tokens: $JC_TOKEN_BUDGET_MAX_TOKENS

memory:
  enabled: false

title:
  enabled: false

# Defense in depth for the `jc_profile_patch` confirm flow: that tool's
# JSON result is parsed by `_maybe_emit_confirm` (see
# deerflow_harness_client.py) to detect `status == "pending_confirm"` and
# surface the frontend confirmation card. If the result ever crosses
# DeerFlow's default externalize_min_chars (12_000), the middleware below
# swaps it for a text synopsis, that parse fails, and the confirm card
# silently never appears — the agent reports success but nothing gets
# written (see the comment in `profile_patch_service.propose_patch`, which
# already keeps the payload small by dropping `preview.merged`). Raising the
# per-tool threshold here is a second, independent guard against the same
# failure mode if the payload ever grows again.
tool_output:
  tool_overrides:
    jc_profile_patch: 60000

authorization:
  enabled: false

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

tool_search:
  enabled: false

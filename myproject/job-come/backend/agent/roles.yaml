# The one declaration of every agent role. A role says who the agent is and how it runs: its
# product, whether a user can open it, its run mode, its model scenario, and which skills it
# works with. Skills are declared in their own packages (backend/agent/skills/public/<id>/SKILL.md):
# what a skill is, the tools it may use, and the fragments it always loads. Loaded and checked by
# jc.agent.roles; docs/decisions/ADR-006-roles-skills-tools.md is the model.
#
# Role fields
#   product     resume | interview | apply | shared. Isolation tests: a role may not hold another
#               product's tools.
#   entry       true when a user may open a session on this role. Exactly one entry role is default.
#   default     true on the one entry role that new sessions and legacy sessions run as.
#   mode        session  - talks to the user; works through its skills, one per turn
#               subtask  - run by the service at a defined point, on one skill, writes back by tool
#               single   - one model call; its skill's body is the prompt; no tools
#   scenario    routing.yaml scenario. Session and subtask roles run on DeerFlow model jc-<scenario>.
#   plan_mode   run in DeerFlow plan mode (session roles only).
#   skills      the skill ids this role works with. The first is the default skill of a turn.
#   turn        session roles: the registered turn-context provider that builds this role's turn
#               message from the database (jc.agent.turn). Omitted = plain message.
#   switch      session roles: rules that change the skill for one turn. `when` names a registered
#               predicate (jc.agent.turn), `to` a skill of this role. First matching rule wins.
#   timeout_seconds  required for subtask roles: the run's time budget, enforced by jc.agent.subtask.

resume-coach:
  product: resume
  entry: true
  default: true
  mode: session
  scenario: coach
  turn: resume_profile
  skills: [resume-coach, profile-interview]
  switch:
    - to: profile-interview
      when: profile_cannot_generate

coach-mock:
  product: interview
  entry: true
  mode: session
  scenario: coach
  turn: mock_session
  skills: [coach-mock, coach-archive]
  switch:
    - to: coach-archive
      when: intent_archive

apply-pipeline:
  product: apply
  entry: true
  mode: session
  scenario: coach
  plan_mode: true
  skills: [apply-pipeline]

interview-reviewer:
  product: interview
  mode: subtask
  scenario: reviewer
  timeout_seconds: 300
  skills: [interview-reviewer]

resume-writer:
  product: resume
  mode: single
  scenario: writer
  skills: [resume-writer]

resume-reviewer:
  product: resume
  mode: subtask
  scenario: reviewer
  timeout_seconds: 90
  skills: [resume-reviewer]

jd-parser:
  product: shared
  mode: single
  scenario: ingest_fast
  skills: [jd-parser]

# Single calls with no per-request composition. Each is one model call whose skill is the prompt.
fit-scorer:
  product: shared
  mode: single
  scenario: flash
  skills: [fit-scorer]

localize:
  product: resume
  mode: single
  scenario: flash
  skills: [localize]

profile-structurer:
  product: resume
  mode: single
  scenario: ingest_fast
  skills: [profile-structurer]

profile-vision:
  product: resume
  mode: single
  scenario: vision
  skills: [profile-vision]

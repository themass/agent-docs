[project]
name = "jc"
version = "0.1.0"
description = "JC API — resume, interview coach, DeerFlow agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentkit==0.1.0",
    "deerflow-extension-api==0.2.9",
    "deerflow-harness==2.3.0.dev0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "aiomysql>=0.2.0",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "httpcore==1.0.9",  # TCP pinning backend contract; covered by security tests
    "anyio>=4.0,<5",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
    "litellm>=1.55.0",
    "langgraph==1.2.19",
    "pyyaml>=6.0.0",
    "mcp>=1.26,<2",
    "markitdown==0.1.5",
    # Headshot normalisation (EXIF orientation, dimension ceiling, JPEG re-encode)
    # in `jc.services.profile_photo_service`. Pinned to a floor rather than exact:
    # the API surface used here (open/exif_transpose/thumbnail/save) has been stable
    # for many major versions, and security fixes in an image decoder are exactly
    # the updates that should not require a JC release to pick up.
    "pillow>=11.0.0",
]

# Prebuilt wheels for the three in-repo packages, checked in under `wheels/`.
#
# These used to point at `../../../../../libs/agentkit/...` with `editable = true`.
# That made the project un-installable anywhere the monorepo was not present — the
# reported symptom was `uv sync` on a deployment host failing with "Distribution not
# found at: file:///.../libs/agentkit", because a path the install could not see was
# a hard requirement of `uv sync`. A wheel is the same code in the form every other
# dependency already ships in: `uv sync` needs no source tree and no checkout depth.
#
# Refresh with `./scripts/build-release.sh --update-lock`, which rebuilds these files,
# rewrites the `==` pins above from what was actually built, and re-locks. Running it
# is mandatory whenever the vendored DeerFlow or agentkit source changes — a stale
# wheel is silently the old code, which is worse than a broken install.
[tool.uv.sources]
agentkit = { path = "wheels/agentkit-0.1.0-py3-none-any.whl" }
deerflow-harness = { path = "wheels/deerflow_harness-2.3.0.dev0-py3-none-any.whl" }
deerflow-extension-api = { path = "wheels/deerflow_extension_api-0.2.9-py3-none-any.whl" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
export = [
    "playwright>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jc"]

[project.scripts]
jc-mcp = "jc.mcp.server:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated, then hand-edited only inside the upgrade body.
# Reflowing the generated column definitions makes migrations harder to diff against
# the model that produced them, and a long line there has never hidden a defect.
# Everything except line length is still enforced here.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# JC — Nginx 参考配置（HTTPS）
# 域名: jc.sspacee.com
#
# 用法：证书就位后，用本文件替换 jc.sspacee.com.conf，然后
#   nginx -t && nginx -s reload
#
# 证书必须由公共 CA 签发。自签名证书在这里不成立：浏览器会整页拦截，
# Googlebot 与 Baiduspider 直接拒绝 TLS 握手——站点会从"排名低"变成"抓不到"。
# 免费且够用的签发方式见 docs/operations/OPS-DEPLOYMENT.md 的 HTTPS 一节。
#
# 切到本文件的同时，这三项必须一起改，否则会出现页面能开但登录态丢失、
# 或 canonical 指向 http 而实际服 https 的割裂状态：
#   1. frontend/web/.env.production  → NEXT_PUBLIC_SITE_URL=https://jc.sspacee.com
#      （改完必须重新 npm run build，这是构建期变量）
#   2. backend/server/.env           → JC_COOKIE_SECURE=true
#   3. backend/server/.env           → JC_PUBLIC_URL=https://jc.sspacee.com

upstream jc_web {
    server 127.0.0.1:3000;
}

upstream jc_api {
    server 127.0.0.1:8000;
}

# HTTP：只做两件事——放行 ACME 续期探测，其余全部 301 到 HTTPS。
#
# 301 而非 302：搜索引擎只把永久跳转的权重完整传给新地址。http 版本此前
# 若已被收录，这条跳转是把它合并到 https 版本的唯一手段。
server {
    listen 80;
    server_name jc.sspacee.com;

    # certbot --webroot 的续期挑战走这里。放在 301 之前，否则自动续期会失败，
    # 证书 90 天后过期，整站变成不可访问。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jc.sspacee.com;

    ssl_certificate     /etc/letsencrypt/live/jc.sspacee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jc.sspacee.com/privkey.pem;

    # fullchain.pem 而非 cert.pem：缺中间证书时桌面浏览器常能自行补全，
    # 移动端和爬虫则直接判定不受信任——这类故障只在部分客户端出现，很难查。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    # HSTS 暂不开启。它会让浏览器在 max-age 内拒绝任何 http 访问，
    # 证书出问题时无法回退到 http 应急。确认 HTTPS 稳定运行数周后再加：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # API（SSE：关闭缓冲）
    location /api/v1/ {
        proxy_pass http://jc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme 在这里是 https，后端据此判断是否可以下发 Secure cookie。
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Next.js
    location / {
        proxy_pass http://jc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Industry / role follow-up question bank (coach-mock)
backend:
  - "这个接口在高并发下如何限流和降级？"
  - "数据一致性是怎么保证的？CAP 你怎么取舍？"
  - "如果 P99 突然翻倍，你的排查顺序是什么？"
frontend:
  - "首屏性能你关注哪些指标？怎么优化？"
  - "复杂表单状态你怎么管理？"
  - "如何做组件库版本兼容与灰度？"
pm:
  - "你如何验证这个需求值得做？"
  - "需求被研发挑战时你怎么推进？"
  - "上线后指标没涨，你会怎么复盘？"
data:
  - "实验显著但业务不显著，你怎么解释？"
  - "特征缺失或样本偏差怎么处理？"
  - "如何把分析结论变成可执行的产品动作？"
devops:
  - "发布失败回滚 SOP 是什么？"
  - "容量规划你怎么做？"
  - "告警太多怎么降噪？"
ios:
  - "内存泄漏或卡顿你怎么定位？"
  - "离线场景与弱网你怎么设计？"
general:
  - "你和上级意见不一致时怎么处理？"
  - "说一个你失败的经历，你学到了什么？"
  - "为什么离开上一家公司？"

[project]
name = "poetry-student-agent"
version = "0.1.0"
description = "Student-facing lesson agent: program-driven five steps, role-pruned context, rule reviewer, gap-only evaluator, scripted fallback"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.34.0",
]

[project.scripts]
student-agent = "student_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student_agent"]

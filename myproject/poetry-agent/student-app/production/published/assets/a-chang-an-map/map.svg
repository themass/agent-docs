<rect x="215" y="135" width="530" height="370" fill="none" stroke="#ded6c6" stroke-width="2" stroke-dasharray="10 8"/>
<text x="480" y="335" text-anchor="middle" font-family="'Songti SC','Noto Serif SC',serif" font-size="56" fill="#1f1e1b">长安</text>
<text x="480" y="600" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="22" fill="#8a857a">示意图,不按比例,不代表真实城郭形制(占位)</text>

[project]
name = "poetry-agent-worker"
version = "0.2.0"
description = "Governed agent run executor: DeerFlow client, deterministic STUB runtime, output validation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0",
  "uvicorn>=0.34.0",
]

[project.scripts]
poetry-agent-worker = "agent_worker.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_worker"]
# prompts/*.md live inside the package, so the wheel carries them.

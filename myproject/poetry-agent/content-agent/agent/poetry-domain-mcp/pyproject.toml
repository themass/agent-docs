[project]
name = "poetry-domain-mcp"
version = "0.1.0"
description = "Restricted MCP boundary for Poetry domain APIs"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "mcp>=1.0.0",
  "pydantic>=2.9.0",
]

[project.scripts]
poetry-domain-mcp = "poetry_domain_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poetry_domain_mcp"]

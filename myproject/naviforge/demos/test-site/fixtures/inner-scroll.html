<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Inner scroll + overlay fixture</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font: 14px system-ui; }
      #playwright-highlight-container,
      #naviforge-mark-layer {
        position: fixed; z-index: 2147483646; padding: 8px 16px; color: #fff;
      }
      #playwright-highlight-container { top: 8px; left: 8px; background: #ff00aa; }
      #naviforge-mark-layer { top: 8px; right: 8px; background: #22c55e; }
      #scroller {
        height: 240px; max-height: 240px; overflow-y: scroll;
        margin: 56px 16px 16px; border: 1px solid #ccc;
      }
      #tall { height: 2400px; background: linear-gradient(#fff, #224); }
    </style>
  </head>
  <body>
    <div id="playwright-highlight-container">highlight</div>
    <div id="naviforge-mark-layer">marks</div>
    <div id="scroller">
      <div id="tall">inner overflow content</div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Video detail fixture</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; padding: 24px; max-width: 720px; }
      button { padding: 10px 18px; cursor: pointer; }
      #status { margin-top: 12px; color: #666; }
    </style>
  </head>
  <body>
    <h1 id="title">演示视频</h1>
    <p>点击播放会请求同源 HLS master（用于 Network 验收，无站点特判）。</p>
    <button id="play" type="button">播放</button>
    <div id="status"></div>
    <script>
      const params = new URLSearchParams(location.search)
      const name = params.get('title') || '演示视频'
      document.getElementById('title').textContent = name
      document.getElementById('play').addEventListener('click', async () => {
        const status = document.getElementById('status')
        status.textContent = 'loading…'
        try {
          const res = await fetch('/fake/master.m3u8')
          status.textContent = res.ok ? 'stream: ' + res.url : 'failed'
        } catch (e) {
          status.textContent = String(e)
        }
      })
    </script>
  </body>
</html>

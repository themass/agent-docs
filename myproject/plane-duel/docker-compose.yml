services:
  server:
    build: { context: ., target: server }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 档案落到挂载卷（spec §廿三.1.3）——不挂载的话 profiles.json 在容器可写层，
      # 容器一重建全员档案无声归零（上线阻断项）
      PROFILES_FILE: /repo/apps/server/data/profiles.json
    volumes:
      - ./data:/repo/apps/server/data
    # 优雅停机窗口（§廿三.2）：进程内 8s 看门狗先走，这里留 15s 兜底再 SIGKILL
    stop_grace_period: 15s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      target: web
      args:
        # 留空 = 前端按当前页面地址推导（同源 /ws），见 apps/client/src/net/socket.ts
        VITE_WS_URL: ''
    restart: unless-stopped
    environment:
      # 本地测试用 localhost（Caddy 自签证书）；上线改成已备案域名，Caddy 自动申请 HTTPS 证书
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
    depends_on:
      server:
        condition: service_healthy

volumes:
  caddy_data:

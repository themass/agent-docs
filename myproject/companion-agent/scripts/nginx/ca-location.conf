# companion-agent 的 nginx location 段（挂在 vpn.conf 的 api.ok123find.top server 块里）
# 插入位置：在 `location /vvv/` 之前

    # companion-agent (陪伴 AI)：/v1/ 路由到 agent 机 104.160.191.87:8081
    # SSE 长连接必须关缓冲，否则回复等整段才到 App
    location ^~ /v1/ {
        proxy_pass http://ca_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 32m;
    }
    location = /companion-health {
        proxy_pass http://ca_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Prometheus 抓取点。指标里有各模型的调用量、token 数和各会话的延迟分布，
    # 能反推出业务体量，所以**只对本机与内网放开**，不对公网。
    # 加内网机器时在 allow 里补一条；用云厂商的托管 Prometheus 就改成它的出口地址段。
    # ^~ 前缀匹配而不是 = 精确匹配：/metrics/snapshot 也要代理
    # （面板读 JSON，Prometheus 读文本）。用 = 会让 snapshot 掉到默认 location 返回 404。
    location ^~ /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://ca_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;          # 每 15 秒抓一次，别淹日志
    }

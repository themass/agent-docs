[project]
name = "companion-agent"
version = "0.1.0"
description = "Companion (Her) roleplay agent service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    # 存储：Postgres（目标库，psycopg 3 同时用于 SQLAlchemy 与 LangGraph checkpoint）；MySQL 驱动保留做兼容
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    # 大脑：DeerFlow 工厂（docs/implementation/spike-results.md T0）
    # deerflow-harness 与它的 extension-api 都是本地 wheel，`[tool.uv.sources]` 只对**直接**
    # 依赖生效，所以 extension-api 在这里显式列一行，否则 lock 会去索引里找它并失败。
    "deerflow-harness==2.3.0.dev0",
    "deerflow-extension-api==0.2.9",
    "langgraph==1.2.20",
    "langchain-openai>=1.7.4",
    # 与 DeerFlow 自己的 uv.lock 对齐；mcp 2.x 会导致 deerflow 导入失败（T0-2）
    "mcp==1.30.0",
    "langchain-mcp-adapters==0.2.2",
    # 服务
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "redis>=5.0",
    "pyjwt>=2.9.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "litellm>=1.55.0",
    # 公共组件库：指标/快照/联邦与 job-come 共用同一套词汇，监控面板因此能一起看。
    "agentkit==0.1.0+20261114.4cbf2ec2",
    # /metrics：进程内指标登记簿（companion/metrics.py）。只是别的包的传递依赖，直接用了就要显式声明。
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# 角色扮演（LiveKit 房间与语音）才需要；浅聊不装
livekit = [
    "livekit-agents==1.8.11",
    # 火山 TTS/STT 用社区插件；我们只覆盖它的鉴权头，不重写协议
    "livekit-plugins-volcengine==1.8.10",
    # 官方语音端点检测
    "livekit-plugins-silero==1.8.11",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "import-linter>=2.16",
]

# deerflow-harness 2.3.0-dev 没有发布到任何索引（是本地构建的开发版），所以从 wheels/ 里的
# wheel 装。wheel 文件本身入库：uv.lock 会固定这个路径，只检出本项目、没有 DeerFlow 源码树的
# 机器（部署机）才能装得出来。换版本要同时换文件并重新 `uv lock`。
[tool.uv.sources]
agentkit = { path = "wheels/agentkit-0.1.0+20261114.4cbf2ec2-py3-none-any.whl" }
deerflow-harness = { path = "wheels/deerflow_harness-2.3.0.dev0-py3-none-any.whl" }
deerflow-extension-api = { path = "wheels/deerflow_extension_api-0.2.9-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion", "src/memory_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

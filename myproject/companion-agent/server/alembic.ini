[alembic]
script_location = migrations
prepend_sys_path = src
# 连接串只从环境变量读取（O §8.1），这里不写任何地址
# 运行：COMPANION_MYSQL_URL=mysql+aiomysql://... alembic upgrade head

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# companion-agent 模型路由。
#
# 场景 → 模型链，按顺序故障转移。密钥与网关地址只通过环境变量引用，不写入本文件。
# 模型名以网关实际返回的名字为准（网关可能回显为别名）。
#
# 换模型不用改这里：每个场景可由 .env 的 COMPANION_LLM_MODEL_<场景名大写> 整体覆盖，
# 逗号分隔、按顺序故障转移，例如
#     COMPANION_LLM_MODEL_COMPANION_CHAT=openai/gpt-6-luna,openai/glm-5.3-flash
# 每个位置的 timeout / reasoning_effort / extra_body 等调优沿用本文件对应位置，
# 那些值是对网关实测出来的，换模型不该重填。变量未设置则用下面写的模型名。

providers:
  gateway:
    api_base_env: COMPANION_LLM_API_BASE
    api_key_env: COMPANION_LLM_API_KEY

scenarios:
  # 对话主脑：DeerFlow 内部经此场景选择模型，流式输出，文字与语音共用
  companion_chat:
    - model: doubao-seed-2-1-pro-260915
      provider: gateway
      timeout_sec: 60
    - model: doubao-seed-2-1-lite-260915
      provider: gateway
      timeout_sec: 60

  # 记忆提取：结构化 JSON 输出，用便宜模型，关闭隐式推理
  memory_extract:
    - model: doubao-seed-2-1-lite-260915
      provider: gateway
      timeout_sec: 60
      reasoning_effort: none
      extra_body:
        thinking:
          type: disabled

  # 会话摘要：长对话超过阈值时压缩较早的消息；删除已压缩的消息后重建摘要。便宜模型，关闭推理
  session_summarize:
    - model: doubao-seed-2-1-lite-260915
      provider: gateway
      timeout_sec: 60
      reasoning_effort: none
      extra_body:
        thinking:
          type: disabled

  # 长任务/内容生成之后的角色化转述（DeerFlow 子任务结果 → 角色口吻）
  companion_rewrite:
    - model: doubao-seed-2-1-lite-260915
      provider: gateway
      timeout_sec: 60

defaults:
  provider: gateway
  api_base_env: COMPANION_LLM_API_BASE
  api_key_env: COMPANION_LLM_API_KEY
  temperature: 0.7
  max_tokens: 4096
